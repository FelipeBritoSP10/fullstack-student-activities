<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
      <main class="calculadora" aria-label="Calculadora">
    <div class="visor">
      <div class="historico"></div>
      <output class="resultado">0</output>
    </div>
 
    <div class="teclas">
      <button class="limpar" id="clear" type="button">C</button>
      <button class="operador" id="backspace" type="button" aria-label="Apagar">⌫</button>
      <button class="operador" id="percent" type="button">%</button>
      <button class="operador" id="divide" type="button" aria-label="Dividir">÷</button>
 
      <button id="digit7" type="button">7</button>
      <button id="digit8" type="button">8</button>
      <button id="digit9" type="button">9</button>
      <button class="operador" id="multiply" type="button" aria-label="Multiplicar">×</button>
 
      <button id="digit4" type="button">4</button>
      <button id="digit5" type="button">5</button>
      <button id="digit6" type="button">6</button>
      <button class="operador" id="subtract" type="button" aria-label="Subtrair">−</button>
 
      <button id="digit1" type="button">1</button>
      <button id="digit2" type="button">2</button>
      <button id="digit3" type="button">3</button>
      <button class="operador" id="add" type="button" aria-label="Somar">+</button>
 
      <button class="zero" id="digit0" type="button">0</button>
      <button id="decimal" type="button">,</button>
      <button class="igual"  id="equals" type="button" aria-label="Igual">=</button>
    </div>
  </main>

  <script src="script.js"></script>

</body>
</html>
