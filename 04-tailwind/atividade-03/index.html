<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Document</title>
  </head>
  <body>
    <header class="mt-10 text-center">
      <h1 class="text-2xl text-blue-300 font-bold">Entrar</h1>
      <h2 class="text-sm text-slate-500">
        Entre com seus dados para continuar
      </h2>
    </header>

    <form class="max-w-sm mx-auto flex flex-col items-center">
      <div class="">
        <label for="email">Email:</label>
        <input
          class="border border-gray-300 mt-3 rounded px-3 py-2"
          type="email"
          name="email"
          placeholder="Digite seu email..."
          autocomplete="email"
          required
        />
      </div>


           <div class="">
        <label for="password">Senha:</label>
        <input
          class="border border-gray-300 mt-3 rounded px-3 py-2"
          type="password"
          name="password"
          placeholder="Digite sua senha..."
          autocomplete="current-password"
          required
        />
      </div>

      <button class="w-full bg-blue-600 text-white py-2 rounded-md mt-4" type="submit">
        Acessar
      </button>
    </form>
  </body>
</html>
